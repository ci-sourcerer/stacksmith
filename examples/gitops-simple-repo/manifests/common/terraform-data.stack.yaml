name: terraform-data
description: Credential-free resources used to demonstrate GitOps layering.

tags:
  - gitops
  - example

components:
  first:
    type: terraform_data
    description: First placeholder resource.
    properties:
      input:
        environment: "{{ inputs.environment }}"
        message: "{{ inputs.message }}"
        name: "{{ inputs.first_name }}"
        project: "{{ inputs.project }}"
  second:
    type: terraform_data
    description: Second placeholder resource.
    properties:
      input:
        environment: "{{ inputs.environment }}"
        message: "{{ inputs.message }}"
        name: "{{ inputs.second_name }}"
        project: "{{ inputs.project }}"
