name: null-resources
description: Credential-free resources used to demonstrate GitOps layering.

tags:
  - gitops
  - example

components:
  first:
    type: null_resource
    description: First placeholder resource.
    properties:
      triggers:
        environment: "{{ inputs.environment }}"
        message: "{{ inputs.message }}"
        name: "{{ inputs.first_name }}"
        project: "{{ inputs.project }}"
  second:
    type: null_resource
    description: Second placeholder resource.
    properties:
      triggers:
        environment: "{{ inputs.environment }}"
        message: "{{ inputs.message }}"
        name: "{{ inputs.second_name }}"
        project: "{{ inputs.project }}"
