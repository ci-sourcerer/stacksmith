name: stacksmith-apply

on:
  push: {}
  workflow_dispatch:
    inputs:
      environments:
        description: Comma-separated environment names. Leave empty for automatic selection.
        required: false
        type: string
      gitops_root:
        description: Relative path to the GitOps root folder.
        required: false
        type: string
      discovery_mode:
        description: "Discovery mode. Supported values: folders (default), flat-files, or env-files."
        required: false
        type: string
      debug:
        description: Enable debug logging and print configured modules and policies.
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  apply:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch }}
    uses: ci-sourcerer/stacksmith/.github/workflows/stacksmith-gitops-opinionated-reusable.yml@main
    with:
      command: apply
      environments: ${{ github.event.inputs.environments || '' }}
      gitops_root: ${{ github.event.inputs.gitops_root || vars.STACKSMITH_GITOPS_ROOT || '.' }}
      discovery_mode: ${{ github.event.inputs.discovery_mode || vars.STACKSMITH_DISCOVERY_MODE || 'auto' }}
      workdir: ${{ vars.STACKSMITH_WORKDIR || '.' }}
      debug: ${{ inputs.debug || false }}
    secrets: inherit
