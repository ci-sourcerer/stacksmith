fixtures:
  mode: per-test-case
  setup:
    inline: |
      fixture_state["example_fixture"] = True
  teardown:
    inline: |
      fixture_state.clear()

variable_policies:
  aws_region:
    - name: accepts_us_east_1
      value: us-east-1
      expect: pass
    - name: rejects_eu_west_1
      value: eu-west-1
      expect: fail

plan_policies:
  ec2_requires_imdsv2:
    - name: passes_when_tokens_required
      resources:
        - address: aws_instance.web
          type: aws_instance
          change:
            after:
              metadata_options:
                http_tokens: required
      expect: pass
    - name: fails_when_tokens_optional
      resources:
        - address: aws_instance.web
          type: aws_instance
          change:
            after:
              metadata_options:
                http_tokens: optional
      expect: fail

  ec2_t3_micro_warning:
    - name: warns_with_stack_context
      resources:
        - address: aws_instance.web
          type: aws_instance
          change:
            after:
              instance_type: t3.micro
      context:
        stack_name: production
        tags:
          - critical
      expect: warn

component_properties:
  aws_s3_bucket:
    bucket_name:
      - name: prefixes_environment_and_normalizes_case
        value: My_Bucket
        inputs:
          environment: prod
        expect:
          output_name: bucket
          value: prod-my-bucket
