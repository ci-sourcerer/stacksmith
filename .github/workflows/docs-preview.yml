name: docs-preview

on:
  pull_request:
    paths:
      - '.github/workflows/docs-preview.yml'
      - 'docs/**'
      - 'zensical.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/update_cli_reference.py'
      - 'src/stacksmith/cli/**'
  workflow_dispatch:

jobs:
  docs:
    uses: ci-sourcerer/common-python-tasks/.github/workflows/docs.yml@v0.11.0
    with:
      python_version: '3.14'
      dependency_group: dev
      generated_docs_check_task: docs-cli-reference-check
      artifact_name: stacksmith-docs-site
    permissions:
      contents: read
